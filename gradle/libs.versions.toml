[versions]
agp                     = "8.4.0"
kotlin                  = "1.9.24"
coreKtx                 = "1.13.1"
appcompat               = "1.7.0"
material                = "1.12.0"
constraintlayout        = "2.1.4"
lifecycle               = "2.8.1"
navigation              = "2.7.7"
firebase                = "33.1.0"
glide                   = "4.16.0"
coroutines              = "1.8.1"
viewmodel               = "2.8.1"

[libraries]
androidx-core-ktx           = { group = "androidx.core",            name = "core-ktx",                      version.ref = "coreKtx" }
androidx-appcompat          = { group = "androidx.appcompat",       name = "appcompat",                     version.ref = "appcompat" }
material                    = { group = "com.google.android.material", name = "material",                   version.ref = "material" }
androidx-constraintlayout   = { group = "androidx.constraintlayout", name = "constraintlayout",            version.ref = "constraintlayout" }
lifecycle-viewmodel-ktx     = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-ktx",      version.ref = "viewmodel" }
lifecycle-livedata-ktx      = { group = "androidx.lifecycle",       name = "lifecycle-livedata-ktx",       version.ref = "lifecycle" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",        version.ref = "lifecycle" }
navigation-fragment-ktx     = { group = "androidx.navigation",      name = "navigation-fragment-ktx",      version.ref = "navigation" }
navigation-ui-ktx           = { group = "androidx.navigation",      name = "navigation-ui-ktx",            version.ref = "navigation" }
firebase-bom                = { group = "com.google.firebase",      name = "firebase-bom",                 version.ref = "firebase" }
firebase-auth               = { group = "com.google.firebase",      name = "firebase-auth-ktx" }
firebase-firestore          = { group = "com.google.firebase",      name = "firebase-firestore-ktx" }
firebase-storage            = { group = "com.google.firebase",      name = "firebase-storage-ktx" }
glide                       = { group = "com.github.bumptech.glide", name = "glide",                       version.ref = "glide" }
coroutines-android          = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",   version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application",                version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services",         version = "4.4.2" }
safe-args           = { id = "androidx.navigation.safeargs.kotlin",    version.ref = "navigation" }
